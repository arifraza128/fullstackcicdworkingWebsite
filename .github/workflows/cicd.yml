
name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

  build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME secret is empty"
            exit 1
          fi
          echo "image=${DOCKERHUB_USERNAME}/cicd-k8s-demo:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

  deploy:
    name: Deploy to Kubernetes on EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -eu

            if [ -z "$IMAGE" ]; then
              echo "ERROR: IMAGE is empty"
              exit 1
            fi

            echo "Deploying image: $IMAGE"

            if sudo kubectl get deployment cicd-demo >/dev/null 2>&1; then
              sudo kubectl set image deployment/cicd-demo \
                cicd-demo="$IMAGE"
            else
              sudo kubectl create deployment cicd-demo \
                --image="$IMAGE"
            fi

            sudo kubectl apply -f - <<'MANIFEST'
            apiVersion: v1
            kind: Service
            metadata:
              name: cicd-demo
            spec:
              type: NodePort
              selector:
                app: cicd-demo
              ports:
                - protocol: TCP
                  port: 80
                  targetPort: 3000
                  nodePort: 30080
            MANIFEST

            sudo kubectl rollout status deployment/cicd-demo \
              --timeout=180s

            echo "Deployment status:"
            sudo kubectl get pods,services
